<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f2f2f2;

            margin: 0;

            padding: 30px;

        }

        .container {

            width: 600px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);

        }

        h1 {

            text-align: center;

            margin-bottom: 25px;

        }

        label {

            display: block;

            margin-top: 12px;

            font-weight: bold;

        }

        input,

        select {

            width: 100%;

            padding: 10px;

            margin-top: 5px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 5px;

        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 25px;

            border: none;

            border-radius: 5px;

            background-color: #333;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {

            background-color: #555;

        }

        .result {

            margin-top: 25px;

            padding: 15px;

            background-color: #f0f0f0;

            border-radius: 8px;

            text-align: center;

        }

        .note {

            margin-top: 20px;

            font-size: 12px;

            color: #666;

            text-align: center;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>Heart Disease Prediction</h1>

    <form action="/predict" method="POST">

        <label>Gender</label>

        <select name="male" required>

            <option value="1">Male</option>

            <option value="0">Female</option>

        </select>

        <label>Age</label>

        <input type="number" name="age" step="any" required>

        <label>Education Level</label>

        <input type="number" name="education" step="any" required>

        <label>Current Smoker</label>

        <select name="currentSmoker" required>

            <option value="1">Yes</option>

            <option value="0">No</option>

        </select>

        <label>Cigarettes Per Day</label>

        <input type="number" name="cigsPerDay" step="any" required>

        <label>Blood Pressure Medication</label>

        <select name="BPMeds" required>

            <option value="1">Yes</option>

            <option value="0">No</option>

        </select>

        <label>Prevalent Stroke</label>

        <select name="prevalentStroke" required>

            <option value="1">Yes</option>

            <option value="0">No</option>

        </select>

        <label>Prevalent Hypertension</label>

        <select name="prevalentHyp" required>

            <option value="1">Yes</option>

            <option value="0">No</option>

        </select>

        <label>Diabetes</label>

        <select name="diabetes" required>

            <option value="1">Yes</option>

            <option value="0">No</option>

        </select>

        <label>Total Cholesterol</label>

        <input type="number" name="totChol" step="any" required>

        <label>Systolic Blood Pressure</label>

        <input type="number" name="sysBP" step="any" required>

        <label>Diastolic Blood Pressure</label>

        <input type="number" name="diaBP" step="any" required>

        <label>BMI</label>

        <input type="number" name="BMI" step="any" required>

        <label>Heart Rate</label>

        <input type="number" name="heartRate" step="any" required>

        <label>Glucose</label>

        <input type="number" name="glucose" step="any" required>

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>{{ prediction }}</h2>

        <p>

            Predicted probability of 10-year CHD:

            <strong>{{ probability }}%</strong>

        </p>

    </div>

    {% endif %}

    <div class="note">

        This application is for educational and machine-learning demonstration

        purposes only. It is not a medical diagnosis.

    </div>

</div>

</body>

</html>
